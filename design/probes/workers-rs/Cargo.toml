[package]
name = "mikaki-workers-rs-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.23.1"
js-sys = "=0.3.106"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
mikaki-oidc = { path = "../../../crates/oidc" }
mikaki-worker = { path = "../../../crates/worker", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
worker = { version = "=0.8.7", features = ["d1"] }
web-sys = { version = "=0.3.106", features = ["Crypto", "CryptoKey", "CryptoKeyPair", "SubtleCrypto", "WorkerGlobalScope"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
