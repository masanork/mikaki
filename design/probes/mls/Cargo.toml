[package]
name = "mikaki-mls-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated MLS device lifecycle qualification for Mikaki"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.23.1"
sha2 = "=0.11.1"
url = "=2.5.8"
# Includes upstream's hpke-rs 0.8 / libcrux dependency fixes (#2261).
# Keep the protocol, credentials and provider on one immutable upstream revision.
openmls = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51", features = ["js"] }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "e0b21a70a55a9014b8de2772b36bf3d638adad51" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"
zeroize = "=1.9.1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
