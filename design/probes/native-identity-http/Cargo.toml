[package]
name = "mikaki-native-identity-http"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the actual native adapter and transport without Tauri's desktop GUI.
[[bin]]
name = "oid4vp_transport"
path = "../../../apps/mikaki-client/src-tauri/examples/oid4vp_transport.rs"

[dependencies]
openidconnect = "=4.0.1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time", "sync"] }
url = "=2.5.8"
zeroize = "1.9"

[workspace]
