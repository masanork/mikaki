[package]
name = "mikaki-jose-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The RustCrypto provider uses getrandom on Wasm.
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
