[package]
name = "sakimori-jose-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
