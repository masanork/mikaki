[package]
name = "sakimori-es256-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
base64 = "=0.23.1"
hex-literal = "=1.1.0"
wasm-bindgen = "=0.2.128"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
