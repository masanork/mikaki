[package]
name = "mikaki-pqc-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Isolated ML-KEM and ML-DSA feasibility probe for mikaki"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ml-kem = { version = "=0.3.2", default-features = false, features = ["hazmat", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["zeroize"] }
wasm-bindgen = "=0.2.128"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "mlkem", "hkdfsha2", "aes"] }
rand_chacha = { version = "=0.10.0", default-features = false }
sha2 = "=0.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.4.3"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
zeroize = "=1.9.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
