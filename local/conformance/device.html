<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width" />
  <title>FIDO 実機確認</title>
  <style>
    body {
      font: 17px system-ui;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    button,
    input {
      font: inherit;
      padding: 10px;
      margin: 6px;
    }
    pre {
      white-space: pre-wrap;
      background: #f4f5f7;
      padding: 16px;
    }
    label {
      display: block;
    }
  </style>
  <h1>FIDO 実機確認</h1>
  <p>
    このブラウザーと実際の認証器で、登録と認証をサーバーまで確認します。テスト用パスキーの作成と本人確認はご自身で操作してください。
  </p>
  <label>テスト名 <input id="name" maxlength="80" /></label>
  <label
    >認証器
    <select id="attachment">
      <option value="platform">Touch ID / Windows Hello</option>
      <option value="">セキュリティキー / スマートフォン</option>
    </select></label
  >
  <button id="register">1. テスト用パスキーを登録</button
  ><button id="authenticate">2. 今回のパスキーで認証</button
  ><button id="discover">3. ユーザー名なしで認証</button>
  <p>
    3では認証器の一覧から、このページのテスト名と同じパスキーを選んでください。localhostの別のテストで作ったものは、このサーバーでは認証できません。
  </p>
  <button id="save">記録をダウンロード</button>
  <pre id="output" aria-live="polite"></pre>
  <script>
    const $ = (id) => document.getElementById(id);
    $('name').value = location.hash
      ? decodeURIComponent(location.hash.slice(1))
      : (sessionStorage.getItem('fido-device-name') ?? `device-${Date.now()}`);
    const records = [];
    const decode = (s) =>
      Uint8Array.from(atob(s.replaceAll('-', '+').replaceAll('_', '/')), (c) => c.charCodeAt(0));
    const encode = (b) =>
      b == null
        ? null
        : btoa(String.fromCharCode(...new Uint8Array(b)))
            .replaceAll('+', '-')
            .replaceAll('/', '_')
            .replaceAll('=', '');
    function log(record) {
      records.push(record);
      $('output').textContent = JSON.stringify(records, null, 2);
    }
    async function post(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      if (!r.ok || data.status !== 'ok') throw Error(data.errorMessage || 'server rejected');
      return data;
    }
    function convert(options) {
      delete options.status;
      delete options.errorMessage;
      options.challenge = decode(options.challenge);
      if (options.user) options.user.id = decode(options.user.id);
      for (const field of ['excludeCredentials', 'allowCredentials'])
        if (options[field])
          options[field] = options[field].map((c) => ({ ...c, id: decode(c.id) }));
      return options;
    }
    function response(credential) {
      const r = credential.response;
      return {
        id: credential.id,
        rawId: encode(credential.rawId),
        type: credential.type,
        response: {
          clientDataJSON: encode(r.clientDataJSON),
          ...(r.attestationObject
            ? { attestationObject: encode(r.attestationObject) }
            : {
                authenticatorData: encode(r.authenticatorData),
                signature: encode(r.signature),
                userHandle: encode(r.userHandle),
              }),
        },
        clientExtensionResults: credential.getClientExtensionResults(),
      };
    }
    async function run(kind, discoverable = false) {
      sessionStorage.setItem('fido-device-name', $('name').value);
      $('register').disabled = $('authenticate').disabled = $('discover').disabled = true;
      const start = performance.now();
      let selectedRegisteredCredential = null;
      try {
        if (!isSecureContext || !navigator.credentials || !window.PublicKeyCredential)
          throw Error('WebAuthn is unavailable in this browser');
        let options, credential;
        if (kind === 'register') {
          options = convert(
            await post('/attestation/options', {
              username: $('name').value,
              displayName: $('name').value,
              attestation: 'none',
              authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
            }),
          );
          options.pubKeyCredParams = [{ type: 'public-key', alg: -7 }];
          if ($('attachment').value)
            options.authenticatorSelection.authenticatorAttachment = $('attachment').value;
          credential = await navigator.credentials.create({ publicKey: options });
        } else {
          // Inventory only public descriptors before issuing the actual ceremony.
          const known = await post('/assertion/options', {
            userVerification: 'required',
            username: $('name').value,
          });
          options = convert(
            await post('/assertion/options', {
              userVerification: 'required',
              ...(discoverable ? {} : { username: $('name').value }),
            }),
          );
          credential = await navigator.credentials.get({ publicKey: options });
          selectedRegisteredCredential = known.allowCredentials.some(
            (c) => c.id === credential?.id,
          );
          if (!selectedRegisteredCredential) {
            throw Error(
              '選択されたパスキーは今回のテスト用ではありません。認証器の一覧でこのページのテスト名を選んでください。',
            );
          }
        }
        if (!credential) throw Error('No credential returned');
        await post(
          kind === 'register' ? '/attestation/result' : '/assertion/result',
          response(credential),
        );
        log({
          time: new Date().toISOString(),
          kind,
          mode: kind === 'register' ? 'registration' : discoverable ? 'discoverable' : 'identified',
          status: 'server verified',
          selected_registered_credential: selectedRegisteredCredential,
          browser: navigator.userAgent,
          attachment: credential.authenticatorAttachment,
          algorithm: credential.response.getPublicKeyAlgorithm?.() ?? null,
          transports: credential.response.getTransports?.() ?? [],
          uv: 'required',
          residentKey: 'required',
          duration_ms: Math.round(performance.now() - start),
        });
      } catch (error) {
        log({
          time: new Date().toISOString(),
          kind,
          mode: discoverable ? 'discoverable' : 'identified',
          status: 'failed',
          selected_registered_credential: selectedRegisteredCredential,
          error: String(error),
        });
      } finally {
        $('register').disabled = $('authenticate').disabled = $('discover').disabled = false;
      }
    }
    $('register').onclick = () => run('register');
    $('authenticate').onclick = () => run('authenticate');
    $('discover').onclick = () => run('authenticate', true);
    $('save').onclick = () => {
      const url = URL.createObjectURL(
        new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' }),
      );
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fido-device-results.json';
      a.click();
      URL.revokeObjectURL(url);
    };
    log({
      time: new Date().toISOString(),
      status: 'ready',
      browser: navigator.userAgent,
      secureContext: isSecureContext,
    });
  </script>
</html>
