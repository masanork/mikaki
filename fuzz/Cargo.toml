[package]
name = "sakimori-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
sakimori-webauthn = { path = "../crates/webauthn" }
libfuzzer-sys = "=0.4.13"
base64 = "=0.23.1"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }

[workspace]
members = ["."]

[[bin]]
name = "registration"
path = "fuzz_targets/registration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "assertion"
path = "fuzz_targets/assertion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false
