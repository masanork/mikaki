# Project and organization keys come from GitHub Actions repository variables.
# See docs/sonarqube-cloud.md for the one-time OSS project setup.
sonar.host.url=https://sonarcloud.io
sonar.projectName=Mikaki
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Initial scope: handwritten Rust and JavaScript/TypeScript. Native mobile
# languages and Svelte components retain their existing dedicated CI checks.
sonar.sources=crates,apps,services,website,local,scripts
sonar.tests=crates,apps,services,website,local,scripts
sonar.inclusions=**/*.rs,**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/*.spec.js,**/*.test.mjs,**/*.spec.mjs,**/*.test.cjs,**/*.spec.cjs,**/test/**/*.rs,**/tests/**/*.rs,**/tests.rs,**/test.rs,**/*_tests.rs,**/test/**/*.ts,**/tests/**/*.ts,**/test/**/*.js,**/tests/**/*.js,**/test/**/*.mjs,**/tests/**/*.mjs,**/test/**/*.cjs,**/tests/**/*.cjs,local/conformance/**/*.ts
# Test inclusion patterns are also excluded from the source scope by the scanner.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/target/**,**/pkg/**,**/pkg-web/**,**/dist/**,**/build/**,**/build-conformance/**,**/gen/**,**/paraglide/**,**/*.d.ts,**/testdata/**,**/examples/**,local/generated/**
sonar.test.exclusions=**/vendor/**,**/node_modules/**,**/target/**,**/pkg/**,**/pkg-web/**,**/dist/**,**/build/**,**/build-conformance/**,**/gen/**,**/paraglide/**,**/*.d.ts,**/testdata/**,**/examples/**,local/generated/**

# Reuse reports from the verify job. Clippy still fails that job on warnings;
# importing its JSON here does not run a second build or weaken that gate.
sonar.rust.clippyReport.reportPaths=artifacts/clippy-report.json
sonar.rust.lcov.reportPaths=artifacts/native-coverage.lcov
sonar.javascript.lcov.reportPaths=artifacts/frontend-coverage.lcov

# Match the existing measured scope: native workspace Rust (excluding the
# browser-wasm and OP Worker crates) and flat Worker UI TypeScript files.
# Other handwritten code stays in static analysis but has no coverage claim.
sonar.coverage.exclusions=apps/**,services/**,website/**,local/**,scripts/**,**/build.rs,crates/browser-wasm/**,crates/worker/src/**,crates/worker/service/**,crates/worker/ui/vite.config.ts,crates/agent-worker/**,crates/work-*/**,crates/helpdesk-rp/*.ts

# Report quality gate results in Cloud without blocking the evaluation workflow.
sonar.qualitygate.wait=false
