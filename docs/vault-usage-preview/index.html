<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaultの操作試作 — mikaki</title>
    <link rel="stylesheet" href="/prototype.css" />
    <script type="module" src="/prototype.js"></script>
  </head>
  <body>
    <div class="preview-label">
      操作モデルの試作 · 架空のデータ · 認証・保存・共有は模擬動作です
    </div>
    <a class="skip" href="#main">本文へ移動</a>
    <header id="fence">
      <canvas aria-hidden="true"></canvas>
      <div class="header-inner">
        <span class="brand">mikaki</span>
        <div class="origin"><span>このページ</span><strong>auth.mikaki.org</strong></div>
        <button id="lock" hidden>ロック</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <section id="closed" class="closed">
        <span class="eyebrow">PERSONAL VAULT</span>
        <h1>御垣の内側へ。</h1>
        <p>会話と手続きの記録を、自分のもとに。</p>
        <button id="open" class="primary">Passkeyで開く</button>
      </section>
      <div id="workspace" hidden>
        <div class="page-heading">
          <div>
            <span class="eyebrow">PERSONAL VAULT</span>
            <h1>Vault</h1>
          </div>
          <span class="open-state">開いています</span>
        </div>
        <nav aria-label="Vaultの内容">
          <button data-view="threads" aria-current="page">会話</button>
          <button data-view="records">記録</button>
          <button data-view="profile">自分の情報</button>
          <button data-view="connections">接続と許可</button>
        </nav>
        <div id="content"></div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
