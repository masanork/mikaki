[package]
name = "mikaki-identity"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
civ-card = { path = "../../apps/mikaki-client/vendor/civ-card" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"
sha1 = "=0.11.0"
sha2 = { version = "=0.11.0", features = ["oid"] }
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["std", "encoding"] }
p256 = { version = "=0.14.0", features = ["ecdsa", "ecdh"] }
base64 = "=0.23.1"
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
hkdf = "=0.13.0"
miniz_oxide = "=0.9.1"
url = "=2.5.8"
ciborium.workspace = true
der = { version = "=0.8.2", features = ["alloc", "derive"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["alloc"] }
x509-cert = { version = "=0.3.0", default-features = false }

[dev-dependencies]
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
