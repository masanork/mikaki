<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mikaki Vault</title>
  </head>
  <body>
    <main>
      <h1>Vault</h1>
      <p>表示名はこのブラウザで暗号化され、Passkeyで復号します。Passkeyを失うと復号できません。</p>
      <label for="name">表示名</label>
      <input id="name" type="text" maxlength="256" autocomplete="name" disabled>
      <button id="unlock" type="button">Passkeyで開く</button>
      <button id="save" type="button" disabled>保存</button>
      <button id="delete" type="button" disabled>削除</button>
      <p id="status" role="status">読み込み中</p>
    </main>
    <script type="module" src="/vault/vault.js"></script>
  </body>
</html>
