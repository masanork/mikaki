<!doctype html>
<html lang="{{locale}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/ui/product.css" />
  </head>
  <body data-session-state="{{session_state}}">
    <a class="product-skip" href="#product-main">{{skip_content}}</a>
    <div class="product-material-shell">
      <header class="product-header product-material">
        <div class="gate-background" data-renderer="css" aria-hidden="true">
          <div class="gate-fallback"><span></span></div>
          <canvas></canvas>
        </div>
        <div class="product-header-inner">
          <span class="auth-brand product-brand">mikaki</span>
          <div class="product-origin">
            <span>{{origin_label}}</span><strong>{{page_host}}</strong>
          </div>
          {{language}}
        </div>
      </header>
      <main id="product-main" tabindex="-1" class="product-result-shell">
        <div class="product-result">
          <div class="product-result-icon {{icon_class}}" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              {{icon}}
            </svg>
          </div>
          <h1>{{heading}}</h1>
          <p>{{body}}</p>
          {{action}}
        </div>
      </main>
    </div>
    <script type="module" src="/ui/session-events.js"></script>
  </body>
</html>
