[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
base64.workspace = true
ciborium.workspace = true
p256.workspace = true
sha2.workspace = true
tiny_http = "=0.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
[lints]
workspace = true
