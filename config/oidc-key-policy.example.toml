# Reference values for the identity/signing-key design; G1 fixes adopted keys and operations.
# This is separate from the session example; do not merge fragments implicitly.
# Integrate accepted values into runtime policy. Never store private key material here.
schema_version = 1

[oidc_logout]
token_ttl = "5m"

[signing]
rotation_interval = "90d"
prepublish_duration = "24h"
jwks_cache_max_age = "5m"
verification_key_min_retention = "32d"
# Actual deletion must also respect retention derived from issued sessions and tokens.
# Shortening this value alone never shortens an existing key's retention deadline.
