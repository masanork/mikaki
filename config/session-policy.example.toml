# Example session policy. This fragment is a design artifact, not a loaded runtime file.
# Durations use explicit s / m / h / d suffixes.
# Do not put private keys, client secrets, cookies, or tokens here.
schema_version = 1

[authentication]
ceremony_ttl = "5m"
ceremony_max_failures = 5

[session]
sso_absolute_ttl = "30d"
app_idle_timeout = "7d"
# The app's absolute expiry is capped by its parent SSO; do not configure it independently.

[session.validation]
lease_ttl = "5m"
# Measure from check start, not response arrival. Do not extend on check failure.

[session.management]
operation_authorization_ttl = "5m"
# Operation/target binding and single use cannot be disabled by configuration.

[oidc]
authorization_code_ttl = "60s"
id_token_ttl = "5m"

[vault]
unlock_idle_timeout = "15m"
unlock_absolute_ttl = "1h"
# Used from P1 onward, independently of the SSO lifetime.
