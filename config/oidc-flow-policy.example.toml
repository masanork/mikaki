# Proposed additional login transaction settings; a review artifact, not a loaded runtime file.
# Integrate accepted values into one active policy; do not implicitly merge fragments.
schema_version = 1

[oidc.login]
transaction_ttl = "10m"

[oidc.client_authentication]
assertion_ttl = "60s"

[oidc.access_token]
ttl = "5m"
# Effective expiry never exceeds the parent SSO absolute expiry.

[oidc.validation]
clock_skew = "30s"

[oidc.backchannel]
request_timeout = "10s"
