name: chat-beta-preflight
on:
  workflow_dispatch:
    inputs:
      main_ci_run_id:
        description: Successful push-to-main CI run for this dispatch commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: chat-beta-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'masanork/mikaki'
    environment:
      name: production
      url: https://auth.mikaki.org
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify the attested candidate and read current production state
        env:
          MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: false
        run: node scripts/prepare-chat-beta-promotion.ts "$MAIN_CI_RUN_ID"
      - name: Retain the preflight report only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-beta-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/chat-beta-preflight/report.json
          if-no-files-found: error
          retention-days: 14
