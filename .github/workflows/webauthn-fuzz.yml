name: webauthn-parser-fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 0'
permissions:
  contents: read
concurrency:
  group: webauthn-fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-09-21 --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked --root target/fuzz-tools
          echo "$PWD/target/fuzz-tools/bin" >> "$GITHUB_PATH"
      - name: Replay independent seed fixtures
        run: cargo +nightly-2026-09-21 run --manifest-path fuzz/Cargo.toml --locked --bin seed
      - name: Fuzz WebAuthn parsers and verification
        run: |
          cargo +nightly-2026-09-21 fuzz run registration -- -max_total_time=90 -max_len=65538 -timeout=10 -print_final_stats=1
          cargo +nightly-2026-09-21 fuzz run assertion -- -max_total_time=90 -max_len=65538 -timeout=10 -print_final_stats=1
          cargo +nightly-2026-09-21 fuzz run android -- -max_total_time=90 -max_len=16416 -timeout=10 -print_final_stats=1
          cargo +nightly-2026-09-21 fuzz run metadata -- -max_total_time=90 -max_len=131074 -timeout=10 -print_final_stats=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webauthn-fuzz-findings
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
