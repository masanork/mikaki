name: attested-worker-build
on:
  workflow_call:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/
      - name: Recheck clean source-bound release and upload inventories
        id: promotion
        run: |
          set -euo pipefail
          inventories=(artifacts/promotion-*/upload-manifest.json)
          [[ ${#inventories[@]} == 1 && -f "${inventories[0]}" ]]
          promotion_dir=$(dirname "${inventories[0]}")
          npm run release:verify
          npm run release:verify-upload -- "$promotion_dir"
          copy_release_sha=$(sha256sum artifacts/work-copy-runtime/release.json | cut -d ' ' -f 1)
          npm run verify:work-copy-release -- artifacts/work-copy-runtime "$copy_release_sha" "$GITHUB_SHA"
          echo "promotion_dir=$promotion_dir" >> "$GITHUB_OUTPUT"
      - name: Attest release inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release-manifest.json
      - name: Attest login asset inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/login-assets.json
      - name: Attest upload inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.promotion.outputs.promotion_dir }}/upload-manifest.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-worker.tar.gz
      - name: Attest runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-worker.tar.gz
          sbom-path: artifacts/supply-chain/worker-rust.cdx.json
      - name: Attest UserInfo claim Worker provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-userinfo-claim-worker.tar.gz
      - name: Attest Work checkpoint provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-work-checkpoint.tar.gz
      - name: Attest companion runtime byte inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/work-copy-runtime/release.json
      - name: Attest companion runtime archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/work-copy-runtime/mikaki-work-copy-runtime.tar.gz
      - name: Attest UserInfo claim Worker SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-userinfo-claim-worker.tar.gz
          sbom-path: artifacts/supply-chain/userinfo-claim-rust.cdx.json
      - name: Attest CBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-worker.tar.gz
          sbom-path: artifacts/supply-chain/worker-crypto.cdx.json
      - name: Attest UserInfo claim Worker CBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-userinfo-claim-worker.tar.gz
          sbom-path: artifacts/supply-chain/userinfo-claim-crypto.cdx.json
      - name: Attest Docs RP source and built assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/mikaki-docs-rp.tar.gz
      - name: Upload Worker and inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-worker-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
