name: local-authentication-slice
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authentication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: verify
      - run: npm ci
      - name: Validate npm release BOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > "$RUNNER_TEMP/npm-build.cdx.json"
      - name: Design and formatting
        run: |
          npm run generate:i18n
          node scripts/check_design.ts
          npm run test:sql
          npm run test:release
          node --test scripts/static-sql.test.ts
          npm run test:worker-budgets
          node --test scripts/publish-metrics.test.mjs
          npm run test:agent-preparation
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo check --locked -p mikaki-worker --target wasm32-unknown-unknown
          cargo check --locked -p mikaki-userinfo-claim-worker --target wasm32-unknown-unknown
          npm run format:check
          npm run check:ui
          npm run check:worker-ui
          npm run check:agent-worker
          npm run check:product-sources
          npm run check:service-authority
          npm run check:i18n
          npm run check:docs
          npm run build:docs
          npm run check:docs-rp
          npm run test:docs-release
      - name: Native tests and measured coverage
        run: |
          cargo test --locked --workspace
          mkdir -p artifacts
          cargo llvm-cov --locked --workspace --exclude mikaki-browser-wasm --exclude mikaki-worker --ignore-filename-regex '/tests\.rs$' --json --summary-only --output-path artifacts/native-coverage.json
          cargo llvm-cov report --locked --ignore-filename-regex '/tests\.rs$' --html --output-dir artifacts/native-coverage
          cargo llvm-cov report --locked --ignore-filename-regex '/tests\.rs$' --lcov --output-path artifacts/native-coverage.lcov
      - name: Shared WebAuthn tests on Wasm
        run: wasm-pack test --node crates/webauthn --locked
      - name: Isolated PQC feasibility probe
        run: |
          npm ci --prefix design/probes
          cargo fmt --manifest-path design/probes/pqc/Cargo.toml -- --check
          npx prettier --check design/probes/pqc/check.ts design/probes/pqc/browser.ts design/probes/pqc/fido-eval.ts design/probes/pqc/fido-eval.html design/probes/pqc/analyze-fido.ts design/probes/pqc/analyze-fido.test.ts design/probes/pqc/nist-acvp-fixtures.json design/probes/pqc/hpke-pq-draft05-vector.json
          node --test design/probes/pqc/analyze-fido.test.ts
          npx prettier --check design/probes/recipient-key-admin.test.ts design/probes/recipient-secret-admin.test.ts
          node --test design/probes/recipient-key-admin.test.ts
          node --test design/probes/recipient-secret-admin.test.ts
          cargo test --locked --manifest-path design/probes/pqc/Cargo.toml
          cargo clippy --locked --manifest-path design/probes/pqc/Cargo.toml --all-targets -- -D warnings
          wasm-pack build design/probes/pqc --target nodejs --release --out-dir pkg -- --locked
          node design/probes/pqc/check.ts
          node design/probes/pqc/hpke-interop.ts
          node --test design/probes/pqc/product-envelope.test.ts
          wasm-pack build design/probes/pqc --target web --release --out-dir pkg-web -- --locked
      - name: Isolated credential-presentation probe
        run: npm run test:oid4vp --prefix design/probes
      - name: Isolated credential receipt and presentation
        run: npm run test:oid4vci --prefix design/probes
      - name: Isolated DPoP and HTTPS credential receipt
        run: |
          npm run test:dpop --prefix design/probes
          npm run test:dpop-network --prefix design/probes
      - name: Build Wasm and UI
        env:
          MIKAKI_UI_COVERAGE: '1'
        run: |
          npm run build
          worker-build --release crates/worker
          worker-build --release crates/userinfo-claim-worker
          worker-build --release -d build-conformance crates/userinfo-claim-worker --features conformance-gate
      - name: Check served UI and server Wasm byte budgets
        run: |
          npm run check:worker-budgets
          cat artifacts/worker-budgets.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check Node TypeScript sources
        run: |
          npm run check:node
          npm run check:helpdesk
      - name: Frontend TypeScript coverage and selected-module regression gate
        run: npm run test:frontend-coverage
      - name: Product Worker contracts
        run: |
          cargo build --locked --manifest-path design/probes/native-identity-http/Cargo.toml --bin oid4vp_transport
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npx playwright install --with-deps chromium
          npm run test:worker-contracts
      - name: Native client UI lifecycle
        run: npm run test:mobile-ui
      - name: Identity presentation, attester, consent and device-preflight regressions
        run: npm run test:identity-contracts
      - name: MDS durable operation regressions
        run: node --test local/conformance/mds-operation.test.ts
      - name: Project size, coverage, and dependency trends
        run: node scripts/metrics.ts --coverage artifacts/native-coverage.json --output-dir artifacts/metrics
      - name: Wasm and browser integration
        env:
          MIKAKI_BROWSER_SOURCE_COVERAGE: '1'
        run: |
          node design/probes/pqc/browser.ts
          npm ci --prefix design/probes/vault-search
          npm run test:vault-thread-search
          npm run test:worker-browser
          npm run test:agent-integration
          npm run test:vault-transfer
          npm run test:vault-disclosure
          npm run test:vault-notes
          npm run test:attribute-commit
          npm run test:e2e
          npm run test:docs-rp
          npm run health
          cat artifacts/health.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authentication-measurements
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  native-client:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Native client library regressions
        run: cargo test --locked --manifest-path apps/mikaki-client/src-tauri/Cargo.toml --lib

  jose-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: design/probes/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: probe
      - run: npm ci --prefix design/probes
      - name: Compile native and Wasm JOSE providers
        run: |
          for probe in jose jose-custom; do
            cargo build --locked --manifest-path "design/probes/$probe/Cargo.toml" --bin fixture
            wasm-pack build "design/probes/$probe" --target nodejs --release --out-dir pkg -- --locked
          done
      - name: Independent JOSE interoperability and rejection cases
        run: node --test --test-concurrency=1 design/probes/jose.test.ts design/probes/jose-custom.test.ts

  android-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/mikaki-client/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Android build targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          printf 'NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - run: npm ci --prefix apps/mikaki-client
      - name: Build Android aarch64 debug APK
        working-directory: apps/mikaki-client
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci
      - name: Proximity protocol regressions
        working-directory: apps/mikaki-client/src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-identity-proximity:testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-client-validation
          path: |
            apps/mikaki-client/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
            apps/mikaki-client/plugins/identity-proximity/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  android-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: worker
      - name: Fetch pinned upstream verifier
        run: |
          printf 'MIKAKI_KEYATTESTATION_CHECKOUT=%s/android-keyattestation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          git clone https://github.com/android/keyattestation "$RUNNER_TEMP/android-keyattestation"
          git -C "$RUNNER_TEMP/android-keyattestation" checkout --detach 55c35040a1b5b72e6d63bfb150c5c68a175c1462
      - name: JVM verifier unit tests and distribution
        run: apps/mikaki-client/src-tauri/gen/android/gradlew --no-daemon -p services/android-attestation-verifier test installDist integrationClasspath
      - run: npm ci
      - name: Build broker and test the actual bridge/JVM chain
        run: |
          npm run generate:i18n
          npm run build:policy
          worker-build --release crates/worker
          node --test local/conformance/identity-attester-jvm.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-verifier-validation
          path: services/android-attestation-verifier/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  dependency-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned audit tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: audit
      - run: |
          npm ci
          npm ci --prefix design/probes
          npm ci --prefix design/probes/vault-search
      - name: Dependency advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file design/probes/pqc/Cargo.lock
          npm audit --prefix design/probes --audit-level=low
          npm audit --prefix design/probes/vault-search --audit-level=low
          npm audit --prefix tools/svelte-check --audit-level=low
          npm audit --audit-level=low
          npm sbom --sbom-format=cyclonedx --sbom-type=application > /dev/null

  worker-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - run: npm ci
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: worker
      - name: Build Worker and run passkey preflight
        run: |
          npm run build:policy
          worker-build --release crates/worker
          MIKAKI_PREFLIGHT_ONLY=1 node local/conformance/oidf-local-worker.ts
      - name: Verify Worker Svelte screens in Chromium
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npx playwright install --with-deps chromium
          npm ci --prefix design/probes/vault-search
          npm run test:vault-thread-search
          npm run test:worker-browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-browser-failures
          path: artifacts/browser-failures/
          if-no-files-found: ignore
          retention-days: 14

  record-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: authentication-measurements
          path: artifacts/
      - name: Record project metrics and refresh charts
        run: node scripts/metrics.ts --record --snapshot-file artifacts/metrics/current.json --output-dir artifacts/metrics
      - name: Commit updated history and charts
        run: bash scripts/publish-metrics.sh

  supply-chain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [verify, dependency-advisories, native-client, jose-probes, android-client, android-verifier]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/supply-chain-build.yml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependency-advisories, supply-chain]
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    needs: [deploy]
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: ./.github/workflows/deploy-docs-production.yml
    secrets: inherit

  production-smoke:
    needs: [deploy, deploy-docs, deploy-website]
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/production-smoke.yml
    with:
      expected_version_id: ${{ needs.deploy.outputs.version_id }}
      expected_source_commit: ${{ needs.deploy.outputs.source_commit }}
      expected_login_js_sha256: ${{ needs.deploy.outputs.login_js_sha256 }}
      expected_login_css_sha256: ${{ needs.deploy.outputs.login_css_sha256 }}
      expected_android_fingerprint: ${{ needs.deploy.outputs.android_fingerprint }}
    secrets: inherit

  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:website
      - run: npm run check:website
      - run: if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:website

  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        verify,
        dependency-advisories,
        website,
        native-client,
        jose-probes,
        android-client,
        android-verifier,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://mikaki.org
    concurrency:
      group: production-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:website
      - name: Deploy current website and app links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-website.ts
