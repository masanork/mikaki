name: local-authentication-slice
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_release_candidate:
        description: Build and test unsigned production artifacts without signing or deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: authentication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security-checks:
    uses: ./.github/workflows/security-checks.yml

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    outputs:
      artifact_id: ${{ steps.measurements.outputs.artifact-id }}
      sonar_artifact_id: ${{ steps.sonar_reports.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: |
            .
            design/probes/pqc
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: verify
      - run: npm ci
      - name: Validate npm release BOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > "$RUNNER_TEMP/npm-build.cdx.json"
      - name: Design and formatting
        run: |
          set -o pipefail
          npm run generate:i18n
          node scripts/check_design.ts
          npm run test:markup
          npm run test:sql
          npm run test:release
          node --test scripts/wallet-multipaz-checkout.test.ts
          npm run test:identity-trust-freshness
          npm run test:webauthn-fuzz
          node --test scripts/static-sql.test.ts
          npm run test:work-authority-packet
          npm run test:work-authority-allocation
          npm run test:work-authority-deployment
          node --test scripts/work-authority-completion.test.ts
          node --test scripts/prepare-work-code-source.test.ts
          npm run test:work-copy-runtime
          npm run test:work-copy-bindings
          node scripts/check-upstream-pins.ts
          npm run test:worker-budgets
          node --test scripts/publish-metrics.test.mjs
          npm run test:agent-preparation
          npm run test:work-artifacts-inspection
          node --test local/conformance/work-webmcp.test.ts
          cargo fmt --all -- --check
          mkdir -p artifacts
          cargo clippy --locked --workspace --all-targets --message-format=json -- -D warnings | tee artifacts/clippy-report.json | jq -r 'select(.reason == "compiler-message") | .message.rendered // empty'
          cargo check --locked -p mikaki-worker --target wasm32-unknown-unknown
          cargo check --locked -p mikaki-userinfo-claim-worker --target wasm32-unknown-unknown
          npm run format:check
          npm run check:ui
          npm run check:worker-ui
          npm run check:agent-worker
          npm run check:product-sources
          npm run check:service-authority
          npm run check:work-sources
          npm run check:work-checkpoint
          npm run check:work-effects
          npm run check:work-copy
          npm run check:work-git-host
          npm run check:i18n
          npm run check:docs
          npm run build:docs
          npm run check:docs-rp
          npm run test:docs-release
      - name: Native tests and measured coverage
        run: |
          cargo test --locked --workspace
          mkdir -p artifacts
          cargo llvm-cov --locked --workspace --exclude mikaki-browser-wasm --exclude mikaki-worker --ignore-filename-regex '/tests\.rs$' --json --summary-only --output-path artifacts/native-coverage.json
          cargo llvm-cov report --locked --ignore-filename-regex '/tests\.rs$' --html --output-dir artifacts/native-coverage
          cargo llvm-cov report --locked --ignore-filename-regex '/tests\.rs$' --lcov --output-path artifacts/native-coverage.lcov
      - name: Shared WebAuthn tests on Wasm
        run: wasm-pack test --node crates/webauthn --locked
      - name: Isolated PQC feasibility probe
        run: |
          npm ci --prefix design/probes
          cargo fmt --manifest-path design/probes/pqc/Cargo.toml -- --check
          npx prettier --check design/probes/pqc/check.ts design/probes/pqc/browser.ts design/probes/pqc/fido-eval.ts design/probes/pqc/fido-eval.html design/probes/pqc/analyze-fido.ts design/probes/pqc/analyze-fido.test.ts design/probes/pqc/nist-acvp-fixtures.json design/probes/pqc/hpke-pq-draft05-vector.json
          node --test design/probes/pqc/analyze-fido.test.ts
          npx prettier --check design/probes/recipient-key-admin.test.ts design/probes/recipient-secret-admin.test.ts
          node --test design/probes/recipient-key-admin.test.ts
          node --test design/probes/recipient-secret-admin.test.ts
          cargo test --locked --manifest-path design/probes/pqc/Cargo.toml
          cargo clippy --locked --manifest-path design/probes/pqc/Cargo.toml --all-targets -- -D warnings
          wasm-pack build design/probes/pqc --target nodejs --release --out-dir pkg -- --locked
          node design/probes/pqc/check.ts
          node design/probes/pqc/hpke-interop.ts
          node --test design/probes/pqc/product-envelope.test.ts
          wasm-pack build design/probes/pqc --target web --release --out-dir pkg-web -- --locked
      - name: Isolated credential-presentation probe
        run: npm run test:oid4vp --prefix design/probes
      - name: Isolated credential receipt and presentation
        run: npm run test:oid4vci --prefix design/probes
      - name: Isolated DPoP and HTTPS credential receipt
        run: |
          npm run test:dpop --prefix design/probes
          npm run test:dpop-network --prefix design/probes
      - name: Build Wasm and UI
        env:
          MIKAKI_UI_COVERAGE: '1'
        run: |
          npm run build
      - name: Check Node TypeScript sources
        run: |
          npm run check:node
          npm run check:helpdesk
      - name: Frontend TypeScript coverage and selected-module regression gate
        run: npm run test:frontend-coverage
      - name: Export SonarQube analysis reports
        id: sonar_reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-analysis-reports-${{ github.run_attempt }}
          path: |
            artifacts/clippy-report.json
            artifacts/native-coverage.lcov
            artifacts/frontend-coverage.lcov
          if-no-files-found: error
          retention-days: 14
      - name: Browser PQC interoperability
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npx playwright install --with-deps chromium webkit
          node design/probes/pqc/browser.ts
      - name: Bunsen and Inter rendering in Chromium and WebKit
        run: npm run test:fonts
      - name: Native client UI lifecycle
        run: |
          npm run test:mobile-ui
          node --test local/conformance/identity-card-ui.test.ts local/conformance/identity-haip-ui.test.ts
      - name: MDS durable operation regressions
        run: node --test local/conformance/mds-operation.test.ts
      - name: Project size, coverage, and dependency trends
        run: node scripts/metrics.ts --coverage artifacts/native-coverage.json --output-dir artifacts/metrics
      - name: Summarize native coverage and browser Wasm sizes
        run: |
          npm run health
          cat artifacts/health.md >> "$GITHUB_STEP_SUMMARY"
      - id: measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authentication-core-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  messaging:
    uses: ./.github/workflows/mls-probe.yml

  sonar:
    name: SonarQube Cloud (evaluation)
    needs: [core, messaging]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Evaluate findings before making the analysis a required merge check.
    continue-on-error: true
    steps:
      - name: Check SonarQube Cloud configuration
        id: configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORGANIZATION" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SonarQube Cloud is not configured. See docs/sonarqube-cloud.md.'
            echo 'SonarQube Cloud analysis skipped: configure the SONAR_TOKEN secret and SONAR_ORGANIZATION / SONAR_PROJECT_KEY variables. See docs/sonarqube-cloud.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configuration.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configuration.outputs.enabled == 'true'
        with:
          artifact-ids: ${{ needs.core.outputs.sonar_artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: artifacts/
      - name: Check analysis reports
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          test -s artifacts/native-coverage.lcov
          test -s artifacts/frontend-coverage.lcov
          test -s artifacts/clippy-report.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configuration.outputs.enabled == 'true'
        with:
          artifact-ids: ${{ needs.messaging.outputs.coverage_artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: artifacts/messaging-coverage/
      - name: Require measured Chat coverage
        if: steps.configuration.outputs.enabled == 'true'
        run: test -s artifacts/messaging-coverage/messaging-coverage.lcov
      - name: Analyze with SonarQube Cloud
        if: steps.configuration.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  worker-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    outputs:
      artifact_id: ${{ steps.measurements.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: |
            .
            design/probes/native-identity-http
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: worker
      - run: npm ci
      - name: Build instrumented Worker and Claim profiles
        env:
          MIKAKI_UI_COVERAGE: '1'
        run: |
          npm run build:policy
          worker-build --release crates/worker
          worker-build --release crates/userinfo-claim-worker
          worker-build --release -d build-conformance crates/userinfo-claim-worker --features conformance-gate
      - name: Check complete Worker bundles and report resource growth
        run: |
          npm run check:worker-budgets
          cat artifacts/worker-budgets.md >> "$GITHUB_STEP_SUMMARY"
      - name: Owner authorization attack matrix (SEC-01 and SEC-06)
        run: |
          set -o pipefail
          npm run build:op-authority
          mkdir -p artifacts/security-authorization
          git rev-parse HEAD > artifacts/security-authorization/source-commit.txt
          sha256sum crates/worker/build/worker/service.mjs crates/worker/build/worker/shim.mjs crates/worker/build/index.js crates/worker/build/index_bg.wasm > artifacts/security-authorization/bundle-sha256.txt
          npm run test:security-authorization | tee artifacts/security-authorization/results.txt
      - name: Authentication mix-up and code-race matrix (SEC-03 and SEC-04)
        run: |
          set -o pipefail
          mkdir -p artifacts/security-authentication
          git rev-parse HEAD > artifacts/security-authentication/source-commit.txt
          sha256sum crates/worker/build/worker/shim.mjs crates/worker/build/index.js crates/worker/build/index_bg.wasm > artifacts/security-authentication/bundle-sha256.txt
          npm run test:security-authentication | tee artifacts/security-authentication/results.txt
      - name: Packaged capability attack matrix (SEC-02 and SEC-18)
        run: |
          set -o pipefail
          mkdir -p artifacts/security-boundaries
          git rev-parse HEAD > artifacts/security-boundaries/source-commit.txt
          sha256sum crates/worker/build/worker/service.mjs crates/worker/build/worker/shim.mjs crates/worker/build/index.js crates/worker/build/index_bg.wasm > artifacts/security-boundaries/bundle-sha256.txt
          npm run test:security-boundaries | tee artifacts/security-boundaries/results.txt
      - name: Agent grant disclosure and commit matrix (SEC-06 and SEC-09)
        run: |
          set -o pipefail
          mkdir -p artifacts/security-grants
          git rev-parse HEAD > artifacts/security-grants/source-commit.txt
          sha256sum crates/worker/build/worker/service.mjs crates/worker/build/worker/shim.mjs crates/worker/build/index.js crates/worker/build/index_bg.wasm > artifacts/security-grants/bundle-sha256.txt
          sha256sum crates/agent-worker/*.ts > artifacts/security-grants/agent-source-sha256.txt
          npm run test:security-grants | tee artifacts/security-grants/results.txt
      - name: Product Worker contracts
        run: |
          cargo build --locked --manifest-path design/probes/native-identity-http/Cargo.toml --bin oid4vp_transport
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npx playwright install --with-deps chromium
          npm run test:worker-contracts
      - name: Identity presentation, attester, consent and device-preflight regressions
        run: npm run test:identity-contracts
      - id: measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authentication-worker-contracts-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  work-authority:
    uses: ./.github/workflows/verify-work.yml
    with:
      suite: authority

  work-effects:
    uses: ./.github/workflows/verify-work.yml
    with:
      suite: effects

  work-product:
    uses: ./.github/workflows/verify-work.yml
    with:
      suite: product

  verify:
    needs:
      [
        core,
        worker-contracts,
        worker-browser,
        work-authority,
        work-effects,
        work-product,
        messaging,
        security-checks,
        chat-release-candidate,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.measurements.outputs.artifact-id }}
    steps:
      - id: core_reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.core.outputs.artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.core.outputs.artifact_id }}
          # The streaming extractor rejects valid font-trace archives with
          # "invalid distance too far back". Keep digest checks, then use unzip.
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/authentication-core
      - name: Extract verified core reports
        if: ${{ always() && steps.core_reports.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/authentication-core/*.zip)
          test "${#archives[@]}" -eq 1
          unzip -q "${archives[0]}" -d artifacts/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.worker-contracts.outputs.artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.worker-contracts.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.worker-browser.outputs.artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.worker-browser.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.work-authority.outputs.artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.work-authority.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.work-effects.outputs.artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.work-effects.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.work-product.outputs.artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.work-product.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/
      - name: Require every verification lane to succeed
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          assert.deepEqual(Object.keys(results).sort(), ['chat-release-candidate', 'core', 'messaging', 'security-checks', 'work-authority', 'work-effects', 'work-product', 'worker-browser', 'worker-contracts']);
          for (const [name, job] of Object.entries(results)) {
            assert.equal(job.result, 'success', `${name}: ${job.result}`);
          }
          JS
      - id: measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authentication-measurements-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  native-client:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/mikaki-client/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: apps/mikaki-client/src-tauri
      - name: Native client library regressions
        run: cargo test --locked --manifest-path apps/mikaki-client/src-tauri/Cargo.toml --lib
      - run: npm ci --prefix apps/mikaki-client
      - name: Build the macOS development app for Apple Silicon and Intel
        working-directory: apps/mikaki-client
        run: npm run build:macos -- --target universal-apple-darwin --ci
      - name: Verify and archive the macOS development app
        run: |
          app='apps/mikaki-client/src-tauri/target/universal-apple-darwin/release/bundle/macos/Mikaki Dev.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/mikaki-client" -verify_arch arm64
          lipo "$app/Contents/MacOS/mikaki-client" -verify_arch x86_64
          mkdir -p artifacts/macos-development
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/macos-development/Mikaki-Dev-universal.app.zip
          (cd artifacts/macos-development && shasum -a 256 Mikaki-Dev-universal.app.zip > SHA256SUMS)
          git rev-parse HEAD > artifacts/macos-development/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mikaki-macos-development-universal-${{ github.run_attempt }}
          path: artifacts/macos-development/
          if-no-files-found: error
          retention-days: 14

  jose-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: design/probes/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: |
            design/probes/jose
            design/probes/jose-custom
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: probe
      - run: npm ci --prefix design/probes
      - name: Compile native and Wasm JOSE providers
        run: |
          for probe in jose jose-custom; do
            cargo build --locked --manifest-path "design/probes/$probe/Cargo.toml" --bin fixture
            wasm-pack build "design/probes/$probe" --target nodejs --release --out-dir pkg -- --locked
          done
      - name: Independent JOSE interoperability and rejection cases
        run: node --test --test-concurrency=1 design/probes/jose.test.ts design/probes/jose-custom.test.ts

  android-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/mikaki-client/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Android build targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          printf 'NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - run: npm ci --prefix apps/mikaki-client
      - name: Build Android aarch64 debug APK
        working-directory: apps/mikaki-client
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci
      - name: Proximity protocol regressions
        working-directory: apps/mikaki-client/src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-identity-proximity:testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-client-validation
          path: |
            apps/mikaki-client/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
            apps/mikaki-client/plugins/identity-proximity/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  android-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: worker
      - name: Fetch pinned upstream verifier
        run: |
          revision="$(node scripts/check-upstream-pins.ts --revision)"
          printf 'MIKAKI_KEYATTESTATION_CHECKOUT=%s/android-keyattestation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          git clone https://github.com/android/keyattestation "$RUNNER_TEMP/android-keyattestation"
          git -C "$RUNNER_TEMP/android-keyattestation" checkout --detach "$revision"
      - name: JVM verifier unit tests and distribution
        run: services/android-attestation-verifier/gradlew --no-daemon -p services/android-attestation-verifier test installDist integrationClasspath
      - name: Validate the source-bound LabPKI certificate and Wallet trust profile
        run: cargo run -p mikaki-identity --locked --example check_haip_pki -- crates/worker/config/identity-haip-labpki.public.json
      - run: npm ci
      - name: Build broker and test the actual bridge/JVM chain
        run: |
          npm run generate:i18n
          npm run build:policy
          worker-build --release crates/worker
          node --test local/conformance/identity-attester-jvm.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-verifier-validation
          path: services/android-attestation-verifier/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  dependency-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned audit tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          bash scripts/install-security-tools.sh "$RUNNER_TEMP/mikaki-security-tools"
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: audit
      - run: |
          npm ci
          npm ci --prefix design/probes
          npm ci --prefix design/probes/vault-search
      - name: Verify dependency policy failure handling
        run: node --test scripts/check-dependency-advisories.test.ts
      - name: Audit every tracked Cargo, npm and Gradle lockfile
        run: MIKAKI_OSV_BIN="$RUNNER_TEMP/mikaki-security-tools/osv-scanner" node scripts/check-dependency-advisories.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-advisories-${{ github.run_attempt }}
          path: artifacts/dependencies/
          if-no-files-found: warn
          retention-days: 14
      - name: Existing RustSec and npm advisories
        if: ${{ !cancelled() }}
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file design/probes/pqc/Cargo.lock
          npm audit --prefix design/probes --audit-level=low
          npm audit --prefix design/probes/vault-search --audit-level=low
          npm audit --prefix tools/svelte-check --audit-level=low
          npm audit --audit-level=low
          npm sbom --sbom-format=cyclonedx --sbom-type=application > /dev/null

  worker-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      MIKAKI_BROWSER_SOURCE_COVERAGE: '1'
    outputs:
      artifact_id: ${{ steps.measurements.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust-cache
      - uses: ./.github/actions/setup-cargo-tools
        with:
          profile: verify
      - run: npm ci
      - name: Build instrumented Worker and Claim profiles
        env:
          MIKAKI_UI_COVERAGE: '1'
        run: |
          npm run build:policy
          worker-build --release crates/worker
          worker-build --release crates/userinfo-claim-worker
          worker-build --release -d build-conformance crates/userinfo-claim-worker --features conformance-gate
      - name: Build browser Wasm, local UI and Docs RP
        run: |
          npm run build
          npm run build:docs
      - name: Passkey preflight
        run: MIKAKI_PREFLIGHT_ONLY=1 node local/conformance/oidf-local-worker.ts
      - name: Worker screens and browser integration
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npx playwright install --with-deps chromium
          npm ci --prefix design/probes/vault-search
          npm run test:vault-thread-search
          npm run test:worker-browser
          npm run test:agent-integration
          npm run test:vault-transfer
          npm run test:vault-disclosure
          npm run test:vault-notes
          npm run test:attribute-commit
          # Includes local/test/docs-rp.test.ts; do not start the same RP suite twice.
          npm run test:e2e
      - id: measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authentication-browser-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  record-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/
      - name: Record project metrics and refresh charts
        run: node scripts/metrics.ts --record --snapshot-file artifacts/metrics/current.json --output-dir artifacts/metrics
      - name: Retain measured history and charts for reviewed publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-metrics-${{ github.run_attempt }}
          path: |
            artifacts/metrics/
            metrics/history.json
            metrics/code-size.svg
            metrics/coverage.svg
            metrics/dependency-inventory.md
          if-no-files-found: error
          retention-days: 30

  release-candidate:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_release_candidate)
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-candidate.yml

  chat-release-candidate:
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-candidate.yml
    with:
      profile: messaging-beta

  chat-supply-chain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        verify,
        chat-release-candidate,
        dependency-advisories,
        native-client,
        jose-probes,
        android-client,
        android-verifier,
      ]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/supply-chain-build.yml
    with:
      profile: messaging-beta

  supply-chain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        verify,
        release-candidate,
        dependency-advisories,
        native-client,
        jose-probes,
        android-client,
        android-verifier,
      ]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/supply-chain-build.yml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependency-advisories, supply-chain]
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: ./.github/workflows/deploy-production.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OP_PRIVATE_JWK: ${{ secrets.OP_PRIVATE_JWK }}
      MIKAKI_READY_TOKEN: ${{ secrets.MIKAKI_READY_TOKEN }}
      WAITLIST_MAIL_KEY: ${{ secrets.WAITLIST_MAIL_KEY }}
      WORK_CREDENTIAL_KEY_V1: ${{ secrets.WORK_CREDENTIAL_KEY_V1 }}
      IDENTITY_ISSUER_JWK: ${{ secrets.IDENTITY_ISSUER_JWK }}
      IDENTITY_TRUSTED_KEYS: ${{ secrets.IDENTITY_TRUSTED_KEYS }}
      IDENTITY_ATTESTER_SIGNING: ${{ secrets.IDENTITY_ATTESTER_SIGNING }}
      IDENTITY_CREDENTIAL_ENCRYPTION_JWK: ${{ secrets.IDENTITY_CREDENTIAL_ENCRYPTION_JWK }}

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    needs: [deploy]
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: ./.github/workflows/deploy-docs-production.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOCS_RP_PRIVATE_JWK: ${{ secrets.DOCS_RP_PRIVATE_JWK }}

  production-smoke:
    needs: [deploy, deploy-docs, deploy-website]
    if: >-
      needs.deploy.outputs.deployed == 'true' &&
      needs.deploy-docs.outputs.deployed == 'true' &&
      needs.deploy-docs.outputs.source_commit == needs.deploy.outputs.source_commit
    uses: ./.github/workflows/production-smoke.yml
    with:
      expected_version_id: ${{ needs.deploy.outputs.version_id }}
      expected_source_commit: ${{ needs.deploy.outputs.source_commit }}
      expected_login_js_sha256: ${{ needs.deploy.outputs.login_js_sha256 }}
      expected_login_css_sha256: ${{ needs.deploy.outputs.login_css_sha256 }}
      expected_android_fingerprint: ${{ needs.deploy.outputs.android_fingerprint }}
    secrets:
      MIKAKI_READY_TOKEN: ${{ secrets.MIKAKI_READY_TOKEN }}

  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:website
      - run: npm run check:website
      - run: if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:website

  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        verify,
        dependency-advisories,
        website,
        native-client,
        jose-probes,
        android-client,
        android-verifier,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://mikaki.org
    concurrency:
      group: production-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:website
      - name: Deploy current website and app links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-website.ts
