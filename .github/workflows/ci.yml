name: local-authentication-slice
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authentication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
          cargo install worker-build --version 0.8.6 --locked
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: npm ci
      - name: Design and formatting
        run: |
          npm run generate:i18n
          node scripts/check_design.ts
          npm run test:sql
          npm run test:release
          node --test scripts/publish-metrics.test.mjs
          npm run test:agent-preparation
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo check --locked -p mikaki-worker --target wasm32-unknown-unknown
          cargo check --locked -p mikaki-userinfo-claim-worker --target wasm32-unknown-unknown
          npm run format:check
          npm run check:ui
          npm run check:worker-ui
          npm run check:agent-worker
          npm run check:product-sources
          npm run check:i18n
          npm run check:docs
      - name: Native tests and measured coverage
        run: |
          cargo test --locked --workspace
          mkdir -p artifacts
          cargo llvm-cov --locked --workspace --exclude mikaki-browser-wasm --exclude mikaki-worker --ignore-filename-regex '/tests\.rs$' --json --summary-only --output-path artifacts/native-coverage.json
          cargo llvm-cov report --locked --ignore-filename-regex '/tests\.rs$' --html --output-dir artifacts/native-coverage
          cargo llvm-cov report --locked --ignore-filename-regex '/tests\.rs$' --lcov --output-path artifacts/native-coverage.lcov
      - name: Shared WebAuthn tests on Wasm
        run: wasm-pack test --node crates/webauthn --locked
      - name: Isolated PQC feasibility probe
        run: |
          npm ci --prefix design/probes
          cargo fmt --manifest-path design/probes/pqc/Cargo.toml -- --check
          npx prettier --check design/probes/pqc/check.ts design/probes/pqc/browser.ts design/probes/pqc/fido-eval.ts design/probes/pqc/fido-eval.html design/probes/pqc/analyze-fido.ts design/probes/pqc/analyze-fido.test.ts design/probes/pqc/nist-acvp-fixtures.json design/probes/pqc/hpke-pq-draft05-vector.json
          node --test design/probes/pqc/analyze-fido.test.ts
          npx prettier --check design/probes/recipient-key-admin.test.ts design/probes/recipient-secret-admin.test.ts
          node --test design/probes/recipient-key-admin.test.ts
          node --test design/probes/recipient-secret-admin.test.ts
          cargo test --locked --manifest-path design/probes/pqc/Cargo.toml
          cargo clippy --locked --manifest-path design/probes/pqc/Cargo.toml --all-targets -- -D warnings
          wasm-pack build design/probes/pqc --target nodejs --release --out-dir pkg -- --locked
          node design/probes/pqc/check.ts
          node design/probes/pqc/hpke-interop.ts
          node --test design/probes/pqc/product-envelope.test.ts
          wasm-pack build design/probes/pqc --target web --release --out-dir pkg-web -- --locked
      - name: Isolated credential-presentation probe
        run: npm run test:oid4vp --prefix design/probes
      - name: Isolated credential receipt and presentation
        run: npm run test:oid4vci --prefix design/probes
      - name: Isolated DPoP and HTTPS credential receipt
        run: |
          npm run test:dpop --prefix design/probes
          npm run test:dpop-network --prefix design/probes
      - name: Build Wasm and UI
        env:
          MIKAKI_UI_COVERAGE: '1'
        run: |
          npm run build
          worker-build --release crates/worker
          worker-build --release crates/userinfo-claim-worker
          worker-build --release -d build-conformance crates/userinfo-claim-worker --features conformance-gate
      - name: Check Node TypeScript sources
        run: |
          npm run check:node
          npm run check:helpdesk
      - name: Frontend TypeScript coverage and selected-module regression gate
        run: npm run test:frontend-coverage
      - name: Product Worker contracts
        run: |
          npx playwright install --with-deps chromium
          npm run test:worker-contracts
      - name: Native client UI lifecycle
        run: npm run test:mobile-ui
      - name: MDS durable operation regressions
        run: node --test local/conformance/mds-operation.test.ts
      - name: Project size, coverage, and dependency trends
        run: node scripts/metrics.ts --coverage artifacts/native-coverage.json --output-dir artifacts/metrics
      - name: Wasm and browser integration
        env:
          MIKAKI_BROWSER_SOURCE_COVERAGE: '1'
        run: |
          node design/probes/pqc/browser.ts
          npm run test:worker-browser
          npm run test:agent-integration
          npm run test:vault-transfer
          npm run test:vault-notes
          npm run test:attribute-proposals
          npm run test:attribute-commit
          npm run test:agent-oauth
          npm run test:e2e
          npm run health
          cat artifacts/health.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: authentication-measurements
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  dependency-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned audit tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked
          npm ci
          npm ci --prefix design/probes
      - name: Dependency advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file design/probes/pqc/Cargo.lock
          npm audit --prefix design/probes --audit-level=low
          npm audit --audit-level=low
          npm sbom --sbom-format=cyclonedx --sbom-type=application > /dev/null

  worker-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - run: npm ci
      - run: cargo install worker-build --version 0.8.6 --locked
      - name: Build Worker and run passkey preflight
        run: |
          npm run build:policy
          worker-build --release crates/worker
          MIKAKI_PREFLIGHT_ONLY=1 node local/conformance/oidf-local-worker.ts
      - name: Verify Worker Svelte screens in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:worker-browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-browser-failures
          path: artifacts/browser-failures/
          if-no-files-found: ignore
          retention-days: 14

  record-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: authentication-measurements
          path: artifacts/
      - name: Record project metrics and refresh charts
        run: node scripts/metrics.ts --record --snapshot-file artifacts/metrics/current.json --output-dir artifacts/metrics
      - name: Commit updated history and charts
        run: bash scripts/publish-metrics.sh

  supply-chain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependency-advisories]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/supply-chain-build.yml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependency-advisories, supply-chain]
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit

  production-smoke:
    needs: [deploy, deploy-website]
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/production-smoke.yml
    with:
      expected_version_id: ${{ needs.deploy.outputs.version_id }}
      expected_source_commit: ${{ needs.deploy.outputs.source_commit }}
      expected_login_js_sha256: ${{ needs.deploy.outputs.login_js_sha256 }}
      expected_login_css_sha256: ${{ needs.deploy.outputs.login_css_sha256 }}
      expected_android_fingerprint: ${{ needs.deploy.outputs.android_fingerprint }}
    secrets: inherit

  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:website
      - run: npm run check:website
      - run: npx playwright install --with-deps chromium
      - run: npm run test:website

  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dependency-advisories, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://mikaki.org
    concurrency:
      group: production-website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:website
      - name: Deploy current website and app links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-website.ts
