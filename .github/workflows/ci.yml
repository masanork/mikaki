name: isolated-artifact-download-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 13813675956
          github-token: ${{ github.token }}
          run-id: 42915817413
          path: ${{ runner.temp }}/release-candidate-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and extract candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/release-candidate-download/*.zip)
          [[ ${#archives[@]} == 1 && -f "${archives[0]}" ]]
          printf '%s  %s\n' cd432af578850b328f900e79a288f8a71e8a6b42dd512b5a18c10e2a60003cbd "${archives[0]}" | sha256sum -c -
          unzip -tq "${archives[0]}"
          mkdir -p artifacts
          unzip -q "${archives[0]}" -d artifacts/
          [[ -f artifacts/release-manifest.json ]]
