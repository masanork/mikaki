name: deploy-production
on:
  workflow_call:
    outputs:
      deployed:
        value: ${{ jobs.promote.outputs.deployed }}
      version_id:
        value: ${{ jobs.promote.outputs.version_id }}
      source_commit:
        value: ${{ jobs.promote.outputs.source_commit }}
      login_js_sha256:
        value: ${{ jobs.promote.outputs.login_js_sha256 }}
      login_css_sha256:
        value: ${{ jobs.promote.outputs.login_css_sha256 }}
      android_fingerprint:
        value: ${{ jobs.promote.outputs.android_fingerprint }}
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'masanork/mikaki'
    environment:
      name: production
      url: https://auth.mikaki.org
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deployed: ${{ steps.activate.outputs.deployed }}
      version_id: ${{ steps.activate.outputs.version_id }}
      source_commit: ${{ steps.activate.outputs.source_commit }}
      login_js_sha256: ${{ steps.activate.outputs.login_js_sha256 }}
      login_css_sha256: ${{ steps.activate.outputs.login_css_sha256 }}
      android_fingerprint: ${{ steps.activate.outputs.android_fingerprint }}
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attested-worker-${{ github.sha }}
          path: artifacts/
      - name: Verify source-bound attestations and prepared bytes
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inventories=(artifacts/promotion-*/upload-manifest.json)
          [[ ${#inventories[@]} == 1 && -f "${inventories[0]}" ]]
          for subject in artifacts/release-manifest.json artifacts/login-assets.json artifacts/mikaki-worker.tar.gz artifacts/mikaki-userinfo-claim-worker.tar.gz "${inventories[0]}"; do
            gh attestation verify "$subject" -R "$GITHUB_REPOSITORY" \
              --signer-workflow masanork/mikaki/.github/workflows/supply-chain-build.yml \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
          done
          promotion_dir=$(dirname "${inventories[0]}")
          npm run release:verify
          npm run release:verify-upload -- "$promotion_dir"
          echo "promotion_dir=$promotion_dir" >> "$GITHUB_OUTPUT"
      - name: Inspect and activate production versions
        id: activate
        env:
          PROMOTION_DIR: ${{ steps.verify.outputs.promotion_dir }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OP_PRIVATE_JWK: ${{ secrets.OP_PRIVATE_JWK }}
          MIKAKI_READY_TOKEN: ${{ secrets.MIKAKI_READY_TOKEN }}
          WAITLIST_MAIL_KEY: ${{ secrets.WAITLIST_MAIL_KEY }}
        run: node scripts/deploy-production.ts "$PROMOTION_DIR"
      - name: Remove temporary secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/mikaki-production-secrets.json"
      - name: Retain deployment and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/production-deployment.json
          if-no-files-found: ignore
          retention-days: 30
