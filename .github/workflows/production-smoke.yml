name: production-smoke
on:
  workflow_dispatch:
    inputs:
      expected_version_id:
        description: Cloudflare OP Worker version ID to verify
        required: false
        type: string
      expected_source_commit:
        description: Attested source commit to verify (40 hex characters)
        required: false
        type: string
      expected_android_fingerprint:
        description: Optional native Android signing certificate SHA-256 fingerprint
        required: false
        type: string
      expected_login_js_sha256:
        description: Optional SHA-256 of the reviewed login JavaScript
        required: false
        type: string
      expected_login_css_sha256:
        description: Optional SHA-256 of the reviewed login stylesheet
        required: false
        type: string
  workflow_call:
    inputs:
      expected_version_id:
        required: false
        type: string
      expected_source_commit:
        required: false
        type: string
      expected_android_fingerprint:
        required: false
        type: string
      expected_login_js_sha256:
        required: false
        type: string
      expected_login_css_sha256:
        required: false
        type: string
    secrets:
      MIKAKI_READY_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  public-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check public issuer endpoints
        shell: bash
        env:
          MIKAKI_EXPECTED_VERSION_ID: ${{ inputs.expected_version_id }}
          MIKAKI_EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          MIKAKI_READY_TOKEN: ${{ secrets.MIKAKI_READY_TOKEN }}
          MIKAKI_EXPECTED_LOGIN_JS_SHA256: ${{ inputs.expected_login_js_sha256 }}
          MIKAKI_EXPECTED_LOGIN_CSS_SHA256: ${{ inputs.expected_login_css_sha256 }}
        run: |
          set -euo pipefail
          issuer=https://auth.mikaki.org
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/health" -o health.txt
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/.well-known/openid-configuration" -o discovery.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/jwks" -o jwks.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/login/login.js" -o login.js
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/login/login.css" -o login.css
          if [[ -n "$MIKAKI_EXPECTED_VERSION_ID" && -n "$MIKAKI_EXPECTED_SOURCE_COMMIT" ]]; then
            if [[ ! "$MIKAKI_READY_TOKEN" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
              echo 'MIKAKI_READY_TOKEN GitHub Actions secret is missing or invalid' >&2
              exit 1
            fi
            curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/version" -o version.json
            printf 'header = "Authorization: Bearer %s"\n' "$MIKAKI_READY_TOKEN" |
              curl --config - -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors -o /dev/null -w '%{http_code}' "$issuer/ready" > ready-status.txt
          fi
          node scripts/check-production-smoke.ts
      - name: Check the source-matched Docs RP and bilingual public entry
        env:
          MIKAKI_EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          set -euo pipefail
          for path in health version; do
            curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "https://docs.mikaki.org/$path" -o "docs-$path.json"
          done
          for lang in ja en; do
            curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "https://docs.mikaki.org/session?lang=$lang" -o "docs-session-$lang.html"
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync('docs-health.json', 'utf8'));
          assert.equal(health.status, 'ok');
          assert.equal(health.issuer, 'https://auth.mikaki.org');
          assert.equal(health.origin, 'https://docs.mikaki.org');
          const version = JSON.parse(readFileSync('docs-version.json', 'utf8'));
          assert.match(version.id, /^[a-f0-9-]{36}$/);
          const expected = process.env.MIKAKI_EXPECTED_SOURCE_COMMIT;
          if (expected) assert.equal(version.tag, expected.slice(0, 12));
          for (const lang of ['ja', 'en']) {
            const html = readFileSync(`docs-session-${lang}.html`, 'utf8');
            assert.ok(html.includes(`<html lang="${lang}">`));
            assert.ok(html.includes('action="/login"'));
          }
          console.log('Docs runtime identity, health and bilingual login entries passed');
          JS
      - name: Audit public website findability
        run: node website/audit-public.ts
      - name: Retain public website audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-findability-${{ github.run_id }}
          path: artifacts/website-findability.json
          if-no-files-found: error
          retention-days: 30
      - name: Check invitation registration links in both languages
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for lang in ja en; do
            jar="$RUNNER_TEMP/enrollment-$lang.cookies"
            touch "$jar"
            curl -fsS -L --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
              -c "$jar" -b "$jar" "https://auth.mikaki.org/enroll?lang=$lang" -o "enrollment-$lang.html"
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const lang of ['ja', 'en']) {
            const html = readFileSync(`enrollment-${lang}.html`, 'utf8');
            assert.ok(html.includes(`<html lang="${lang}">`));
            assert.ok(html.includes('data-enrollment="true"'));
            assert.ok(html.includes(`data-rp-uri="https://auth.mikaki.org/enroll/complete?lang=${lang}"`));
          }
          console.log('Public Japanese and English invitation registration entries passed');
          JS
      - name: Check Web signin and protected Vault entries
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for entry in signin vault; do
            for lang in ja en; do
              jar="$RUNNER_TEMP/web-$entry-$lang.cookies"
              touch "$jar"
              curl -fsS -L --max-redirs 2 --proto '=https' --proto-redir '=https' \
                --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
                -c "$jar" -b "$jar" "https://auth.mikaki.org/$entry?lang=$lang" \
                -o "web-$entry-$lang.html" -w '%{url_effective}' > "web-$entry-$lang.url"
            done
          done
          node scripts/check-web-signin-smoke.ts
      - name: Retain version-matched smoke evidence
        if: ${{ inputs.expected_version_id != '' && inputs.expected_source_commit != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-smoke-${{ github.run_id }}
          path: artifacts/production-smoke.json
          if-no-files-found: error
          retention-days: 30
      - name: Check native Android association
        if: ${{ inputs.expected_android_fingerprint != '' }}
        env:
          MIKAKI_EXPECTED_ANDROID_FINGERPRINT: ${{ inputs.expected_android_fingerprint }}
        run: |
          set -euo pipefail
          host=https://app.mikaki.org
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$host/.well-known/assetlinks.json" -o assetlinks.json
          curl -sS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors -D native-callback-headers.txt -o /dev/null -w '%{http_code}' "$host/oidc/native/callback?code=smoke-code&state=smoke-state" > native-callback-status.txt
          curl -sS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors -o /dev/null -w '%{http_code}' "$host/authorize" > native-authorize-status.txt
          node scripts/check-native-association.ts
