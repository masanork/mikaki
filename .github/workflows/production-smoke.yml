name: production-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check public issuer endpoints
        shell: bash
        run: |
          set -euo pipefail
          issuer=https://mikaki.tossa.app
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/health" -o health.txt
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/.well-known/openid-configuration" -o discovery.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$issuer/jwks" -o jwks.json
          node scripts/check-production-smoke.ts
