name: reconcile-production-0031
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan, or separately approved application of 0031
        type: choice
        options: [plan, apply-0031]
        default: plan
      approved_plan_sha256:
        description: For apply only, exact SHA-256 from the reviewed plan run
        type: string
        default: ''
      confirm_apply:
        description: 'For apply only, type: APPLY 0031 TO mikaki-auth'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Serialize with existing production promotions; never cancel a running mutation.
  group: production-deployment
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.repository == 'masanork/mikaki'
    environment:
      name: production
      url: https://auth.mikaki.org
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: false
      RECONCILE_MODE: ${{ inputs.mode }}
      APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
    steps:
      # Implementation is reviewed on main; migration/config inputs are a separate pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fd55932eee716c2c623cbbb45d1c8b68ec8c354e
          path: reviewed-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: reviewed-source/.node-version
          cache: npm
          cache-dependency-path: reviewed-source/package-lock.json
      - name: Install reviewed dependencies without lifecycle scripts
        working-directory: reviewed-source
        run: npm ci --ignore-scripts
      - name: Read ledger/schema and record a checked Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-production-0031.ts plan
      - name: Retain recovery coordinate before any application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-0031-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-0031-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply only reviewed 0031 and verify the full ledger and exact schema
        if: inputs.mode == 'apply-0031'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-production-0031.ts apply
      - name: Retain sanitized application outcome, including uncertain failures
        if: always() && inputs.mode == 'apply-0031'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-0031-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-0031-result.json
          if-no-files-found: ignore
          retention-days: 30
