name: reconcile-production-0033
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan, or approved missing 0033 only
        type: choice
        options: [plan, apply-reviewed]
        default: plan
      approved_plan_sha256:
        description: For apply only, exact SHA-256 from the reviewed plan run
        type: string
        default: ''
      confirm_apply:
        description: 'For apply only, type: APPLY 0033 TO mikaki-auth'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Serialize with existing production promotions; never cancel a running mutation.
  group: production-deployment
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.repository == 'masanork/mikaki'
    environment:
      name: production
      url: https://auth.mikaki.org
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: false
      RECONCILE_MODE: ${{ inputs.mode }}
      APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
    steps:
      # Implementation is reviewed on main; migration/config inputs are a separate pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc3ad859e6668461d36388fb3a6f93e7c18cd06
          path: reviewed-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: reviewed-source/.node-version
          cache: npm
          cache-dependency-path: reviewed-source/package-lock.json
      - name: Install reviewed dependencies without lifecycle scripts
        working-directory: reviewed-source
        run: npm ci --ignore-scripts
      - name: Read ledger/schema and record a checked Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-production-0031.ts plan
      - name: Retain recovery coordinate before any application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-0033-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-0033-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply only missing reviewed 0033 and verify ledger and schema
        if: inputs.mode == 'apply-reviewed'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/reconcile-production-0031.ts apply
      - name: Retain sanitized application outcome, including uncertain failures
        if: always() && inputs.mode == 'apply-reviewed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-0033-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-0033-result.json
          if-no-files-found: ignore
          retention-days: 30
