name: Pinned Cargo tools
description: Restore and install version-pinned CI tools in a dedicated directory
inputs:
  profile:
    description: Tool set (verify, audit, worker, or release)
    required: true
runs:
  using: composite
  steps:
    - name: Cache pinned Cargo tools
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/mikaki-ci-tools-${{ inputs.profile }}
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-tools-v1-${{ inputs.profile }}-${{ hashFiles('rust-toolchain.toml', 'scripts/install-ci-tools.sh', '.github/actions/setup-cargo-tools/action.yml', '.github/workflows/ci.yml', '.github/workflows/supply-chain-build.yml') }}
    - name: Install exact Cargo tool versions
      shell: bash
      env:
        MIKAKI_CI_TOOL_PROFILE: ${{ inputs.profile }}
      run: bash scripts/install-ci-tools.sh "$MIKAKI_CI_TOOL_PROFILE"
