version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /apps/mikaki-client/src-tauri
      - /design/probes/es256
      - /design/probes/jose
      - /design/probes/jose-custom
      - /design/probes/native-identity-http
      - /design/probes/pqc
      - /design/probes/workers-rs
      - /fuzz
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
  - package-ecosystem: npm
    directories:
      - /
      - /apps/mikaki-client
      - /design/probes
      - /design/probes/vault-search
      - /tools/svelte-check
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      javascript-dependencies:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
  - package-ecosystem: gradle
    directories:
      - /apps/mikaki-client/src-tauri/gen/android
      - /apps/mikaki-client/plugins/identity-proximity/android
      - /apps/mikaki-client/plugins/identity-reader/android
      - /apps/mikaki-client/plugins/native-dpop/android
      - /services/android-attestation-verifier
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      jvm-dependencies:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
