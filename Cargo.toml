[workspace]
members = ["crates/webauthn", "crates/auth", "crates/oidc", "crates/browser-wasm", "crates/worker", "crates/userinfo-claim-worker"]
exclude = ["design/probes/es256", "design/probes/pqc", "fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "=0.23.1"
ciborium = "=0.2.2"
futures-util = "=0.3.34"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
wasm-bindgen = "=0.2.128"
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
