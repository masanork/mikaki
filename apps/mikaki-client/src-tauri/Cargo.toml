[package]
name = "mikaki-client"
version = "0.1.0"
edition = "2021"
description = "Mikaki desktop and mobile client"

[lib]
name = "mikaki_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
openidconnect = "=4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-deep-link = "=2.6.1"
url = "=2.5.8"
zeroize = "1.9"
base64 = "=0.23.1"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
mikaki-identity = { path = "../../../crates/identity" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-identity-proximity = { path = "../plugins/identity-proximity" }
tauri-plugin-identity-reader = { path = "../plugins/identity-reader" }
tauri-plugin-native-dpop = { path = "../plugins/native-dpop" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio = { version = "1", features = ["io-util", "net", "time", "sync"] }

[workspace]
