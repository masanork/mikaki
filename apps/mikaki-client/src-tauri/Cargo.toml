[package]
name = "mikaki-client"
version = "0.1.0"
edition = "2021"
description = "Mikaki desktop and mobile client"

[lib]
name = "mikaki_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
openidconnect = "=4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-deep-link = "=2.6.2"
url = "=2.5.8"
zeroize = "1.9"
base64 = "=0.23.1"
p256 = { version = "=0.14.0", features = ["ecdsa"] }
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
sha2 = "=0.11.1"
# ICAO 9303 BAC only; these legacy algorithms are not used for new credentials.
sha1 = { version = "=0.11.0", features = ["zeroize"] }
des = { version = "=0.9.0", features = ["zeroize"] }
cipher = "=0.5.2"
subtle = "=2.6.1"
qrcode = { version = "0.14", default-features = false }
mikaki-identity = { path = "../../../crates/identity" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-identity-proximity = { path = "../plugins/identity-proximity" }
tauri-plugin-identity-reader = { path = "../plugins/identity-reader" }
tauri-plugin-native-dpop = { path = "../plugins/native-dpop" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio = { version = "1", features = ["io-util", "net", "time", "sync"] }

[workspace]
